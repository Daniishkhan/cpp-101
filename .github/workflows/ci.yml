# ci.yml — builds and tests every challenge on every push, and runs the tooling tests.
#
# What it runs is tools/ci-challenges.sh, so you can run the same thing on your Mac:
#   tools/ci-challenges.sh
#
# Red tests are expected while a challenge is in progress (the stubs return wrong answers until you
# write them). A red *build* is never expected. The run's summary page shows a table per challenge.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  challenges:
    name: Challenges (macOS, Apple clang, Debug + sanitizers, Release)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show the toolchain
        run: |
          command -v ninja >/dev/null || brew install ninja
          c++ --version
          cmake --version | head -n 1
          echo "ninja $(ninja --version)"

      - name: Build and test every challenge
        run: tools/ci-challenges.sh

  tooling:
    name: Tooling tests (Python, offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: python3 --version
      - name: Book tutor guard and server tests
        run: python3 tools/test_tutor.py
      - name: Book tutor API-provider tests
        run: python3 tools/test_tutor_api.py
